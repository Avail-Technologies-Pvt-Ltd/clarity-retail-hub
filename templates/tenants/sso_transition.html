<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url={{ next_url }}">
    <title>Launching {{ company.name|default:"Workspace" }} &bull; Clarity Retail Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: #0b1120;
            --bg-card: #1e293b;
            --border-color: #334155;
            --teal-400: #2dd4bf;
            --teal-500: #14b8a6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-base);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .transition-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(20, 184, 166, 0.2);
            border-top-color: var(--teal-400);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: .88rem;
            line-height: 1.4;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(20, 184, 166, 0.12);
            color: var(--teal-400);
            border: 1px solid rgba(20, 184, 166, 0.3);
            border-radius: 99px;
            padding: 3px 12px;
            font-size: .75rem;
            font-weight: 600;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="transition-card">
        <div class="spinner"></div>
        <h2>Launching Workspace</h2>
        <p>Connecting to <strong>{{ company.name|default:"Tenant Store" }}</strong> with authorized credentials...</p>
        <div class="badge">
            <i class="fa-solid fa-lock"></i> Single Sign-On Verified
        </div>
    </div>

    <script>
        // Seamless first-party document transition
        // Commits cookies under the tenant subdomain before navigating
        (function() {
            var target = "{{ next_url|escapejs }}";
            if (!target || target === '') {
                target = '/';
            }
            window.location.replace(target);
        })();
    </script>
</body>
</html>
