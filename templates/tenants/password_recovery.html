<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery — Clarity Retail Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1120;
            --bg-surface: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --teal-500: #14b8a6;
            --teal-600: #0d9488;
            --teal-400: #2dd4bf;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-base);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .recovery-wrapper {
            max-width: 440px;
            width: 100%;
        }
        .recovery-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
        }
        .suite-breadcrumb {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand-badge {
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            color: #ffffff;
            font-weight: 800;
            font-size: .8rem;
            letter-spacing: .08em;
            padding: 5px 12px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-label {
            display: block;
            font-size: .78rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 8px;
        }
        .input-field {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            color: #f1f5f9;
            font-size: .92rem;
            outline: none;
            transition: border-color .15s ease;
        }
        .input-field:focus {
            border-color: var(--teal-500);
            box-shadow: 0 0 0 1px var(--teal-500);
        }
        .btn-submit {
            width: 100%;
            background: var(--teal-600);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px -2px rgba(13, 148, 136, 0.4);
        }
        .btn-submit:hover {
            background: var(--teal-500);
            transform: translateY(-1px);
        }
        .alert-box {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: .84rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }
        .alert-info {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #7dd3fc;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: .82rem;
            margin-bottom: 18px;
            transition: color .15s ease;
        }
        .back-link:hover {
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="recovery-wrapper">
        <a href="{% url 'user_login' %}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Sign In
        </a>

        <div class="recovery-card">
            <div class="suite-breadcrumb">
                <span class="brand-badge">CLARITY</span>
                <h1 style="font-size: 1.45rem; font-weight: 800; color: #f1f5f9; letter-spacing: -0.02em;">Password Recovery</h1>
                <p style="color: #94a3b8; font-size: .84rem; margin-top: 6px;">
                    Enter your registered email address to receive password recovery instructions.
                </p>
            </div>

            {% if message %}
            <div class="alert-box {% if status == 'success' %}alert-success{% elif status == 'error' %}alert-error{% else %}alert-info{% endif %}">
                {% if status == 'success' %}
                    <i class="fa-solid fa-circle-check" style="font-size:1.1rem;"></i>
                {% elif status == 'error' %}
                    <i class="fa-solid fa-triangle-exclamation" style="font-size:1.1rem;"></i>
                {% else %}
                    <i class="fa-solid fa-circle-info" style="font-size:1.1rem;"></i>
                {% endif %}
                <span>{{ message }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{% url 'password_recovery' %}">
                {% csrf_token %}
                <div class="input-group">
                    <label class="input-label">Registered Email Address</label>
                    <div style="position:relative;">
                        <input type="email" name="email" class="input-field" placeholder="e.g. root@avail.co.zw or your email" required autofocus style="padding-left:38px;">
                        <i class="fa-solid fa-envelope" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#64748b; font-size:.85rem;"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Send Recovery Instructions
                </button>
            </form>

            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center; display:flex; justify-content:space-between; font-size:.8rem;">
                <a href="{% url 'user_login' %}" style="color:var(--teal-400); text-decoration:none;">
                    <i class="fa-solid fa-arrow-left"></i> Return to Login
                </a>
                <a href="/" style="color:#64748b; text-decoration:none;">
                    Clarity Overview
                </a>
            </div>
        </div>
    </div>
</body>
</html>
